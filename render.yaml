services:
  - type: web
    name: discover-kenya
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /api/packages
    disk:
      name: data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
